name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg installation
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript check
        run: pnpm typecheck

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test
        env:
          CI: true

      - name: Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_NAME: Synchra
          DRIVE_FOLDER_URL: ${{ secrets.DRIVE_FOLDER_URL || 'https://drive.google.com/drive/folders/12YWqmzkzRCQJt262YuQ1pajwtk73PND3' }}
          DRIVE_FILE_IDS: ${{ secrets.DRIVE_FILE_IDS || '' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || '' }}

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            .next/
            public/tracks/
          retention-days: 1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check track ingestion (dry run)
        run: |
          echo "Checking track ingestion script..."
          tsx scripts/fetch_tracks.ts --dry-run || echo "Track fetching may fail in CI without real Drive access"

      - name: Build with empty tracks (fallback)
        run: |
          mkdir -p public/tracks
          echo '{"tracks":[],"lastUpdated":"'$(date -Iseconds)'","totalTracks":0}' > public/tracks/tracks.json
          pnpm build
        env:
          NEXT_PUBLIC_APP_NAME: Synchra